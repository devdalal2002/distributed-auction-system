services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.9
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "nats-server", "--version"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gateway:
    build: ../gateway
    environment:
      - APP_ENV=${APP_ENV}
      - PG_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      # HTTP targets for Phase 2
      - AUCTION_BASE=http://auction:8081
      - BID_BASE=http://bid:8082
      - USER_BASE=http://user:8083
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      auction:
        condition: service_healthy
      bid:
        condition: service_healthy
      user:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  auction:
    build: ../auction
    environment:
      - APP_ENV=${APP_ENV}
      - PG_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NATS_URL=nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "8081:8081"     # HTTP
      - "50051:50051"   # gRPC
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8081/health', timeout=2).getcode()==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bid:
    build: ../bid
    environment:
      - APP_ENV=${APP_ENV}
      - PG_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8082/health', timeout=2).read() else sys.exit(1)\""]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  user:
    build: ../user
    environment:
      - APP_ENV=${APP_ENV}
      - PG_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8083/health', timeout=2).read() else sys.exit(1)\""]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: ../worker
    environment:
      - APP_ENV=${APP_ENV}
      - PG_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
